<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your soundtrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">

        <div class="logo">🎬</div>

        <h1>YOUR SOUNDTRACK</h1>

        <p class="subtitle">Detecting your scene...</p>

        <section class="scene">
            <p class="label">CURRENT SCENE</p>

            <h2 id="scene">Detecting...</h2>

            <p id="description">
                Your soundtrack is being created.
            </p>
        </section>

        <section class="music">
            <p class="label">SOUNDTRACK</p>

            <h2 id="song">Waiting for a scene...</h2>

            <button id="playButton">▶ Play</button>
        </section>

        <div class="sensors">
            <section class="music-profile">

    <p class="label">YOUR MUSIC PROFILE</p>

    <h2>Artists you love 🎧</h2>

    <div class="artists">

        <button class="artist">Olivia Rodrigo</button>

        <button class="artist">María Becerra</button>

        <button class="artist">TINI</button>

        <button class="artist">Nicki Nicole</button>

        <button class="artist">Taylor Swift</button>

    </div>

</section>
        <div>
    <span id="microphoneStatus">🎤 Microphone: OFF</span>
    <br>
    <button id="micButton">Enable microphone</button>
</div>
          <span id="motionStatus">📱 Motion: detecting...</span>
       </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
